[project]
name = "hisobdon-bot"
version = "1.0.0"
description = "Owner-only Uzbek personal finance Telegram bot"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20,<4",
    "openpyxl>=3.1,<4",
    "cryptography>=44",
    "tzdata>=2025",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
